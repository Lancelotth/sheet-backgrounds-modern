name: Preview background framing (branch only)

on:
  push:
    branches:
      - feature/background-framing-preview

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Validate JavaScript, JSON and tests
        run: |
          node --check scripts/main-preview-v2.mjs
          node --test tests/*.test.mjs
          python3 - <<'PY'
          import json, pathlib
          m = json.loads(pathlib.Path("module.json").read_text())
          assert m["id"] == "sheet-backgrounds-modern"
          assert m["version"] == "0.1.6-preview.2"
          assert m["esmodules"] == ["scripts/main-preview-v2.mjs"]
          assert m["styles"] == ["styles/sheet-backgrounds-modern.css"]
          for p in m["esmodules"] + m["styles"] + [i["path"] for i in m.get("languages", [])]:
              assert pathlib.Path(p).is_file(), p
          for language in m.get("languages", []):
              json.loads(pathlib.Path(language["path"]).read_text())
          PY
      - name: Package preview module
        run: |
          python3 - <<'PY'
          import json, pathlib, zipfile
          m = json.loads(pathlib.Path("module.json").read_text())
          assets = ["module.json"] + m["esmodules"] + m["styles"] + [i["path"] for i in m.get("languages", [])]
          dist = pathlib.Path("dist")
          dist.mkdir(exist_ok=True)
          (dist / "module.json").write_text(json.dumps(m, indent=2) + "\n")
          with zipfile.ZipFile(dist / "sheet-backgrounds-modern.zip", "w", zipfile.ZIP_DEFLATED) as z:
              z.write(dist / "module.json", "module.json")
              for item in assets[1:]:
                  z.write(item, item)
          PY
      - name: Publish isolated GitHub prerelease (not Latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: preview-background-framing-2
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/module.json dist/sheet-backgrounds-modern.zip --clobber
          else
            gh release create "$TAG" dist/module.json dist/sheet-backgrounds-modern.zip \
              --target "$GITHUB_SHA" \
              --title "Preview: Background framing & darkness v0.1.6-preview.2" \
              --prerelease \
              --notes "Experimental preview built from feature/background-framing-preview. Does not alter the latest stable release. See docs/FRAMING-PREVIEW.md in the branch."
          fi
